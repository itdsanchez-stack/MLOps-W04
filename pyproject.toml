[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ai4i_maintenance"
version = "0.0.1"
description = "Experimentaci\u00f3n base con MLflow: mantenimiento predictivo (AI4I 2020)"
authors = [
  { name = "Daniel S\u00e1nchez Hern\u00e1ndez" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["ai4i_maintenance"]
include = ["pyproject.toml", "ai4i_maintenance/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["ai4i_maintenance"]
force-sort-within-sections = true

